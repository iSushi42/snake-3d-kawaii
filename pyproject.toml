[project]
name = "snake"
version = "0.1.0"
description = "Jeu de Snake 3D rétro-kawaii en raycasting temps réel sous pygame-ce"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pygame-ce>=2.5.8",
]

[project.scripts]
kawaii-snake = "snake.kawaii_main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
